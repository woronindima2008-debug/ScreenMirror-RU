name: Upstream build feasibility

on:
  workflow_dispatch:
  push:
    branches:
      - feature/castlab-fcast-integration
    paths:
      - .github/workflows/upstream-inspection.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and unpack CastLab 1.7.0 source
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 https://f-droid.org/repo/app.fedilab.castlab_16_src.tar.gz -o castlab-outer.tar.gz
          mkdir castlab
          tar -xzf castlab-outer.tar.gz -C castlab
          inner="$(find castlab -type f -name '*.tar.gz' -print -quit)"
          test -n "$inner"
          mkdir castlab-src
          tar -xzf "$inner" -C castlab-src
          root="$(find castlab-src -mindepth 1 -maxdepth 2 -type f -name app.json -printf '%h\n' | head -1)"
          test -n "$root"
          echo "CASTLAB_ROOT=$root" >> "$GITHUB_ENV"
          echo "=== app.json ==="
          cat "$root/app.json"
          echo "=== package identity and scripts ==="
          node -e "const p=require('./$root/package.json'); console.log(JSON.stringify({name:p.name,scripts:p.scripts,expo:p.expo},null,2))"
          echo "=== android project files ==="
          find "$root/android" -maxdepth 3 -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'AndroidManifest.xml' \) -print
      - name: Build CastLab Android release
        working-directory: ${{ env.CASTLAB_ROOT }}
        run: |
          set -euxo pipefail
          npm install --legacy-peer-deps
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Fetch and build FCast Android receiver
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/futo-org/fcast.git fcast
          cd fcast/receivers/android
          echo "=== Android build configuration ==="
          sed -n '1,240p' app/build.gradle
          sed -n '1,160p' README.md
          chmod +x gradlew
          ./gradlew tasks --all --no-daemon
          ./gradlew assembleDebug --no-daemon
      - name: Upload upstream APK build probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-apk-build-probes
          path: |
            castlab-src/**/android/app/build/outputs/apk/**/*.apk
            fcast/receivers/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7
