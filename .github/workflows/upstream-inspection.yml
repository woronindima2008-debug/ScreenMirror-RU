name: Upstream source inspection

on:
  workflow_dispatch:
  push:
    branches:
      - feature/castlab-fcast-integration
    paths:
      - .github/workflows/upstream-inspection.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download CastLab 1.7.0 source archive
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            https://f-droid.org/repo/app.fedilab.castlab_16_src.tar.gz \
            --output castlab-source.tar.gz
          mkdir castlab-source
          tar -xzf castlab-source.tar.gz -C castlab-source
          echo "=== Archive top-level ==="
          find castlab-source -maxdepth 2 -type f | sort | head -200
          echo "=== Package and Android project metadata ==="
          find castlab-source -type f \( -name package.json -o -name app.json -o -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts -o -name gradle.properties -o -name AndroidManifest.xml \) -print
          echo "=== Version / package / app entry ==="
          find castlab-source -name app.json -o -name package.json | while read f; do
            echo "--- $f"
            sed -n '1,180p' "$f"
          done
      - name: Inspect FCast Android receiver source
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/futo-org/fcast.git fcast
          echo "=== FCast Android receiver tree ==="
          find fcast/receivers/android -maxdepth 4 -type f | sort | head -250
          echo "=== FCast Android receiver Gradle metadata ==="
          find fcast/receivers/android -maxdepth 4 -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'AndroidManifest.xml' -o -name 'README*' \) -print
      - name: Upload source inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-source-inspection
          path: |
            castlab-source.tar.gz
          if-no-files-found: warn
          retention-days: 7
