name: Upstream build feasibility

on:
  workflow_dispatch:
  push:
    branches:
      - feature/castlab-fcast-integration
    paths:
      - .github/workflows/upstream-inspection.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and inspect CastLab 1.7.0 source archive
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 https://f-droid.org/repo/app.fedilab.castlab_16_src.tar.gz -o castlab-source.tar.gz
          echo "=== Archive entries ==="
          tar -tzf castlab-source.tar.gz > castlab-archive-list.txt
          sed -n '1,100p' castlab-archive-list.txt
          mkdir castlab-src
          tar -xzf castlab-source.tar.gz -C castlab-src
          echo "=== Extracted project files ==="
          find castlab-src -maxdepth 5 -type f \( -name app.json -o -name package.json -o -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts -o -name AndroidManifest.xml \) -print
          root="$(find castlab-src -type f -name package.json -printf '%h\n' | head -1)"
          test -n "$root"
          echo "CASTLAB_ROOT=$root" >> "$GITHUB_ENV"
          echo "=== package.json ==="
          cat "$root/package.json"
          echo "=== app config ==="
          find "$root" -maxdepth 2 -type f \( -name app.json -o -name app.config.js -o -name app.config.ts \) -print -exec sed -n '1,220p' {} \;
          echo "=== Android project root ==="
          find "$root" -maxdepth 3 -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradlew' \) -print
      - name: Fetch and inspect FCast Android receiver
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/futo-org/fcast.git fcast
          echo "=== FCast Android receiver tree ==="
          find fcast/receivers/android -maxdepth 4 -type f | sort > fcast-android-files.txt
          sed -n '1,250p' fcast-android-files.txt
          echo "=== FCast Gradle files ==="
          find fcast/receivers/android -maxdepth 4 -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradlew' -o -name 'README*' \) -print
          echo "=== FCast README ==="
          sed -n '1,240p' fcast/receivers/android/README.md
      - name: Upload upstream source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-source-diagnostics
          path: |
            castlab-source.tar.gz
            castlab-src/
            fcast/receivers/android/
          if-no-files-found: warn
          retention-days: 7
