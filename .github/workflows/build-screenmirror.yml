name: Build ScreenMirror RU APKs

on:
  workflow_dispatch:
  push:
    branches:
      - feature/castlab-fcast-integration
    paths:
      - .github/workflows/build-screenmirror.yml

permissions:
  contents: read

jobs:
  tv-receiver:
    name: Build Android TV receiver
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch FCast Android receiver
        run: |
          git clone --depth 1 --branch android-v2.1.5 https://github.com/futo-org/fcast.git fcast

      - name: Apply ScreenMirror RU branding
        working-directory: fcast/receivers/android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text().replace('applicationId "com.futo.fcast.receiver"', 'applicationId "ru.screenmirror.tv"')
          s = s.replace('buildConfigField "boolean", "IS_PLAYSTORE_VERSION", "false"', 'buildConfigField "boolean", "IS_PLAYSTORE_VERSION", "true"')
          p.write_text(s)
          ru = Path('app/src/main/res/values-ru/strings.xml')
          s = ru.read_text()
          s = s.replace('<string name="app_name">FCast-приемник</string>', '<string name="app_name">ScreenMirror RU</string>')
          s = s.replace('<string name="sender_app_download_text">Вам нужно приложение-отправитель?\\nЗагрузите Grayjay по адресу </string>', '<string name="sender_app_download_text">Установите ScreenMirror RU на телефон и подключитесь к этому телевизору</string>')
          s = s.replace('<string name="sender_app_download_url">https://grayjay.app</string>', '<string name="sender_app_download_url"></string>')
          ru.write_text(s)
          en = Path('app/src/main/res/values/strings.xml')
          s = en.read_text().replace('<string name="app_name">FCast Receiver</string>', '<string name="app_name">ScreenMirror RU</string>')
          s = s.replace('<string name="sender_app_download_text">Need a sender app?\\nDownload Grayjay at </string>', '<string name="sender_app_download_text">Install ScreenMirror RU on your phone to connect to this TV</string>')
          s = s.replace('<string name="sender_app_download_url">https://grayjay.app</string>', '<string name="sender_app_download_url"></string>')
          en.write_text(s)
          PY

      - name: Build TV APK
        working-directory: fcast/receivers/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDefaultFlavorDebug

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenMirror-RU-Android-TV-debug
          path: fcast/receivers/android/app/build/outputs/apk/defaultFlavor/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  phone-sender:
    name: Build Android phone sender
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Download CastLab 1.7.0 source
        run: |
          set -euo pipefail
          mkdir castlab
          curl -fL --retry 3 https://f-droid.org/repo/app.fedilab.castlab_16_src.tar.gz -o castlab-source.tar.gz
          tar -xzf castlab-source.tar.gz -C castlab
          root="$(find castlab -path '*/node_modules' -prune -o -type f -name package.json -print -quit | xargs -r dirname)"
          test -n "$root"
          echo "CASTLAB_ROOT=$root" >> "$GITHUB_ENV"

      - name: Apply ScreenMirror RU branding
        shell: bash
        run: |
          set -euo pipefail
          cd "$CASTLAB_ROOT"
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          p.expo.name = 'ScreenMirror RU';
          p.expo.slug = 'screenmirror-ru';
          p.expo.android = p.expo.android || {};
          p.expo.android.package = 'ru.screenmirror.mobile';
          fs.writeFileSync('app.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          sed -i '/signingConfig /d' android/app/build.gradle 2>/dev/null || true

      - name: Install JavaScript dependencies
        working-directory: ${{ env.CASTLAB_ROOT }}
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate native Android project
        working-directory: ${{ env.CASTLAB_ROOT }}
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --clean

      - name: Set Android application label and package
        working-directory: ${{ env.CASTLAB_ROOT }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          lines = p.read_text().splitlines()
          out = []
          for line in lines:
              stripped = line.strip()
              if stripped.startswith('signingConfig '):
                  continue
              if stripped.startswith('applicationId '):
                  line = "    applicationId 'ru.screenmirror.mobile'"
              elif stripped.startswith('namespace '):
                  line = "    namespace 'ru.screenmirror.mobile'"
              out.append(line)
          p.write_text('\n'.join(out) + '\n')
          PY

          # Force the React Native JS bundle into the debug APK; no Metro server is needed.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'debuggableVariants = []' not in s:
              if 'react {' not in s:
                  raise SystemExit('React Gradle block not found')
              s = s.replace('react {', 'react {\n    debuggableVariants = []', 1)
              p.write_text(s)
          PY

      - name: Build phone APK
        working-directory: ${{ env.CASTLAB_ROOT }}/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenMirror-RU-Android-phone-debug
          path: ${{ env.CASTLAB_ROOT }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
